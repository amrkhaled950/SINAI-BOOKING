<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <!-- Circular background for great visibility in dark & light browser tabs -->
  <circle cx="128" cy="128" r="124" fill="#FAF6EF" />
  
  <!-- Outer dashed terracotta ring -->
  <circle
    cx="128"
    cy="128"
    r="108"
    fill="none"
    stroke="#C45437"
    stroke-width="7"
    stroke-dasharray="10 8"
    stroke-linecap="round"
  />

  <!-- Inner solid dark ring -->
  <circle
    cx="128"
    cy="128"
    r="90"
    fill="none"
    stroke="#22211F"
    stroke-width="4.5"
  />

  <!-- SB Handcrafted Monogram -->
  <text
    x="128"
    y="148"
    font-family="'Playfair Display', 'Caveat', serif, sans-serif"
    font-size="82"
    font-weight="700"
    font-style="italic"
    fill="#22211F"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="-2px"
  >SB</text>
</svg>
